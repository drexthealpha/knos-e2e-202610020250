# 0.3.19 track C: a token for the netting and advance rounds of the run's own wallets (devnet only, test USDC).
# Called from this repository's own c19 workflows; the token's audience is the input. The token is never printed:
# it is encrypted to the run's own public key below and kept one day as an artifact. This file decides nothing
# about any work: whoever starts its caller chooses the audience.
name: c19 fund
on:
  workflow_call:
    inputs:
      aud:
        required: true
        type: string
permissions: {}
jobs:
  token:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: ask GitHub for a token, encrypted to the run's key
        env:
          AUD: ${{ inputs.aud }}
          RUN_PUB: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArJqWmWN/xg6jm8ROqhmU
            P3aZOcywNplx1INaFzW1nVBKr33LvVrqfHRMyt7gq+UDij3oKjkb8vU7pxiW3bNl
            3qiT5652IHXGFqlNeba3MbmXQD+m/GkCMmfCXB2+ubr3rGSf4z2NFzYaGhRPcPjk
            D/1aZhMFctZUfAODXE8wzqUT01YTq5lPDJLwA/IyA3UcXw2piw6reQxsnQW4wWIP
            xiNMd9t9kqtc7IPkYH80/1RxZ2XQkYuAJXVUG0ZKNzSnugKpxiSq/h/tpycFC+xi
            Xzp64SHC9Scbit/D8XPl5vPpdUkwrfNu5b95SB/3oYnlU2+og3AuVQPz59I5CW5B
            XbiUSbkgEi4Nz/CodtuQE7rJPO/IbVlNornj+91cJTtG5K6KUMkpM2HjtExMItXv
            erw1bS4sG0JcpeVzBkkg8avhOb3pHdLoAy43Vsqv5iQ3smZPuEow5wJNoAvCtq/p
            IMoG/Wgu8VwHh30WRiRb8uE1+jIjGCyUzFWXpBiXfg31AgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RUN_PUB" > pub.pem
          Q=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["AUD"], safe=""))')
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Q"             | python3 -c 'import json, sys; open("token.jwt", "w").write(json.load(sys.stdin)["value"])'
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in token.jwt -out token.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.txt -out k.enc
          rm -f token.jwt k.txt
          mkdir out && mv token.enc k.enc out/
      - uses: actions/upload-artifact@v4
        with:
          name: token-enc
          path: out
          retention-days: 1
